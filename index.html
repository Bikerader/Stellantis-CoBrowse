<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CX Cloud Test Website</title>
    <style>
      .top-images {
        position: absolute;
        top: 20px;
        right: 20px;
        display: flex;
        gap: 20px; /* Space between images */
        z-index: 1000;
      }
      .top-image {
        width: 200px;
        height: auto;
      }
      p {
        font-size: 1.5em; /* Makes the <p> text larger */
      }
    </style>
</head>
<body>
    <div class="top-images">
      <img src="Genesys.png" alt="Left Image" class="top-image">
      <img src="stellantis.png" alt="Right Image" class="top-image">
    </div>
    <h1>Welcome to the Stellantis Co-Browse Demo Site</h1>
    <p>Please open Messenger to begin a conversation</p>
    <a href="second-page.html">Go to Second Page</a>

<script type="text/javascript" charset="utf-8">
  (function (g, e, n, es, ys) {
    g['_genesysJs'] = e;
    g[e] = g[e] || function () {
      (g[e].q = g[e].q || []).push(arguments)
    };
    g[e].t = 1 * new Date();
    g[e].c = es;
    ys = document.createElement('script');
    ys.async = 1;
    ys.src = n;
    ys.charset = 'utf-8';
    ys.onload = function() {
      // Create and assign variable for department
      var departmentValue = "sales"; 

      // Use the variable inside Database.set
      Genesys("command", "Database.set", {
        messaging: {
          customAttributes: {
            department: departmentValue,
            property_type: "apartment",
            device: "mobile"
          }
        }
      });
    };
    document.head.appendChild(ys);
  })(window, 'Genesys', 'https://apps.usw2.pure.cloud/genesys-bootstrap/genesys.min.js', {
    environment: 'prod-usw2',
    deploymentId: '7ae86052-039d-4b82-89aa-e38d9baa188d'
  });
</script>

</body>
</html>
